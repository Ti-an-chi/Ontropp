<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONTROPP — Explore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/CORE.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/components/cards.css">
  <link rel="stylesheet" href="./css/components/masonry.css">
  <link rel="stylesheet" href="./css/components/filter.css">
  <link rel="stylesheet" href="./css/tabs/dashboard.css">
  <link rel="stylesheet" href="./css/tabs/explore.css">
</head>
<body>

  <header class="dashboard-header">
    <div class="header-container">
      <div class="logo">ONTROPP.</div>
      <div class="header-actions">
        <a href="signup.html" class="btn btn-primary btn-small">Sign in</a>
      </div>
    </div>
  </header>

  <main class="tab-content active" id="tab-explore">

    <div class="explore-search-bar">
      <div class="explore-search-input">
        <i class="fas fa-search"></i>
        <input type="text" id="explore-search"
               placeholder="Search studios, works, moods…"
               autocomplete="off">
      </div>
    </div>

<div class="filters-bar" id="explore-filter-bar">
  <button class="filters-chip active" data-category="all">All</button>
  <button class="filters-chip" data-category="textiles">Textiles</button>
  <button class="filters-chip" data-category="tailoring">Tailoring</button>
  <button class="filters-chip" data-category="jewellery">Jewellery</button>
  <button class="filters-chip" data-category="objects">Objects</button>
  <button class="filters-chip" data-category="beauty">Beauty</button>
  <button class="filters-chip" data-category="print">Print</button>

  <button class="filters-chip filters-chip--trailing" id="explore-filter-toggle"
          aria-label="More filters">
    <i class="fas fa-sliders-h"></i> Filters
  </button>
</div>

<div class="filters-panel" id="explore-filter-panel">
  <div class="filters-group" id="filter-group-location" hidden>
    <div class="filters-group-label">Location</div>
    <div class="filters-options">
      <button class="filters-toggle" id="filter-location-toggle">
        <i class="fas fa-location-dot"></i> Near me
      </button>
    </div>
  </div>

  <div class="filters-group" id="filter-group-following" hidden>
    <div class="filters-group-label">From designers you follow</div>
    <div class="filters-options">
      <button class="filters-toggle" id="filter-following-toggle">
        <i class="fas fa-user-check"></i> Following only
      </button>
    </div>
  </div>

  <div class="filters-group" id="filter-group-recent" hidden>
    <div class="filters-group-label">Recently visited studios</div>
    <div class="filters-options">
      <button class="filters-toggle" id="filter-recent-toggle">
        <i class="fas fa-clock-rotate-left"></i> Show recent
      </button>
    </div>
  </div>

  <div class="filters-invite" id="explore-signedout-hint" hidden>
    <div class="filters-invite-icon"><i class="fas fa-user"></i></div>
    <div class="filters-invite-text">
      <div class="filters-invite-title">Sign in to unlock filters</div>
      <div class="filters-invite-body">
        Filter by location, designers you follow, and studios you've visited.
      </div>
    </div>
    <a href="signup.html" class="filters-invite-cta" id="explore-signin-link">
      Sign in <i class="fas fa-arrow-right"></i>
    </a>
  </div>
</div>
    <!-- Quiet filter echo — no count -->
    <div class="explore-echo" id="explore-echo" hidden></div>

    <div class="piece-wall" id="explore-wall"></div>

  </main>

  <div id="toast-root"></div>

  <script type="module">
    import API from './api.mock.js';
    import { initExploreTab } from './js/tabs/explore.js';

    /* -----------------------------------------------------
       DEV AUTH — uncomment one block to test viewer states.
       ----------------------------------------------------- */

    // Signed-out (default — no code needed)

    // Signed-in buyer (unlocks location/following/recent filters):
    // API.setAuth({
    //   id: 'u1',
    //   username: 'Amara',
    //   email: 'amara@ontropp.test',
    //   avatar_url: 'https://i.pravatar.cc/150?img=47',
    //   role: 'buyer',
    // });

    document.addEventListener('DOMContentLoaded', async () => {
      await initExploreTab();
    });
  </script>
</body>
</html>
