<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONTROPP | Fashion Design</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="./css/CORE.css">
  <link rel="stylesheet" href="./css/components/buttons.css">
  <link rel="stylesheet" href="./css/components/cards.css">
  <link rel="stylesheet" href="./css/tabs/dashboard.css">
  <link rel="stylesheet" href="./css/pages/piece.css">

</head>

<body>

  <header class="dashboard-header">
    <div class="header-container">
      <a href="#" class="logo">ONTROPP</a>
      <div class="header-actions">
        <button class="icon-btn notification-btn" type="button" aria-label="Notifications">
          <i class="fa-regular fa-bell"></i>
        </button>
        <img 
          class="studio-logo profile-icon" 
          alt="Studio Logo" 
          style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border);"
        />
      </div>
      
    </div>
  </header>

  <main>

    <!-- HERO -->
    <section class="featured-section" data-state-view="piece-hero">
      <!-- Loading State -->
      <div class="sv-state" data-state="loading">
        <div class="featured-image skeleton-image-4-5 shimmer"></div>
        <div class="image-actions">
          <div class="action-buttons">
            <button type="button" aria-label="Like design" disabled><i class="fa-regular fa-heart"></i></button>
            <button type="button" aria-label="Share design" disabled><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
            <button type="button" aria-label="More options" disabled><i class="fa-solid fa-ellipsis"></i></button>
            <button type="button" class="btn btn-primary save-pill" disabled>Save</button>
          </div>
        </div>
        <div class="design-details">
          <div class="design-description">
            <h1 class="skeleton-line w-60 h-32 shimmer"></h1>
            <p class="collection skeleton-line w-40 h-14 mt-2 shimmer"></p>
            <div class="description">
              <div class="skeleton-line w-100 h-14 mt-2 shimmer"></div>
              <div class="skeleton-line w-95 h-14 mt-2 shimmer"></div>
              <div class="skeleton-line w-85 h-14 mt-2 shimmer"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="sv-state" data-state="empty" hidden>
        <div class="sv-empty">
          <i class="fas fa-image"></i><p>This piece couldn't be loaded.</p>
        </div>
      </div>

      <!-- Data State -->
      <div class="sv-state" data-state="data" hidden>
        <div class="featured-image">
          <img class="js-hero-img" src="" alt="">
        </div>
        <div class="image-actions">
          <div class="action-buttons">
            <button type="button" aria-label="Like design"><i class="fa-regular fa-heart"></i></button>
            <button type="button" aria-label="Share design"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
            <button type="button" aria-label="More options"><i class="fa-solid fa-ellipsis"></i></button>
            <button type="button" class="btn btn-primary save-pill">Save</button>
          </div>
        </div>
        <div class="design-details">
          <div class="design-description">
            <h1 class="js-hero-studio"></h1>
            <p class="collection js-hero-collection"></p>
            <p class="description js-hero-description"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- MAKER -->
    <section class="featured-section" data-state-view="piece-maker">
      <!-- Loading State -->
      <div class="sv-state" data-state="loading">
        <div class="design-details">
          <div class="designer-profile">
            <div class="designer-info">
              <div class="initials-avatar skeleton-avatar shimmer"></div>
              <div class="designer-text">
                <h3 class="skeleton-line w-30 h-16 shimmer"></h3>
                <p class="skeleton-line w-20 h-12 mt-2 shimmer"></p>
              </div>
            </div>
            <button type="button" class="follow-btn skeleton-btn shimmer"></button>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="sv-state" data-state="empty" hidden>
        <div class="sv-empty"><i class="fas fa-user"></i><p>Designer info unavailable.</p></div>
      </div>

      <!-- Data State -->
      <div class="sv-state" data-state="data" hidden>
        <div class="design-details">
          <div class="designer-profile">
            <div class="designer-info">
              <div class="initials-avatar js-maker-initials"></div>
              <div class="designer-text">
                <h3 class="js-maker-name"></h3>
                <p class="js-maker-role"></p>
              </div>
            </div>
            <button type="button" class="follow-btn" id="designer-follow-btn">Follow</button>
          </div>
        </div>
      </div>
    </section>

    <!-- GARMENT SPECIFICATIONS -->
    <section class="featured-section" data-state-view="piece-garment">
      <!-- Loading State -->
      <div class="sv-state" data-state="loading">
        <div class="design-details">
          <div class="garment-details">
            <h2 class="skeleton-line w-40 h-20 shimmer"></h2>
            <div class="garment-grid">
              <div class="garment-item">
                <div class="skeleton-icon shimmer"></div>
                <div>
                  <span class="skeleton-line w-20 h-12 shimmer"></span>
                  <p class="skeleton-line w-40 h-12 mt-2 shimmer"></p>
                </div>
              </div>
              <div class="garment-item">
                <div class="skeleton-icon shimmer"></div>
                <div>
                  <span class="skeleton-line w-20 h-12 shimmer"></span>
                  <p class="skeleton-line w-40 h-12 mt-2 shimmer"></p>
                </div>
              </div>
              <div class="garment-item">
                <div class="skeleton-icon shimmer"></div>
                <div>
                  <span class="skeleton-line w-20 h-12 shimmer"></span>
                  <p class="skeleton-line w-40 h-12 mt-2 shimmer"></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="sv-state" data-state="empty" hidden>
        <div class="sv-empty"><i class="fas fa-shirt"></i><p>No details available.</p></div>
      </div>

      <!-- Data State -->
      <div class="sv-state" data-state="data" hidden>
        <div class="design-details">
          <div class="garment-details">
            <h2>More about this design</h2>
            <div class="garment-grid"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- OTHER WORKS -->
    <section class="other-works" data-state-view="piece-other">
      <div class="gallery-heading">
        <h2>More works</h2>
        <a href="#" class="view-all">View All <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      
      <!-- Loading State -->
      <div class="sv-state" data-state="loading">
        <div class="skeleton-row">
          <div class="skeleton-card shimmer"></div>
          <div class="skeleton-card shimmer"></div>
          <div class="skeleton-card shimmer"></div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="sv-state" data-state="empty" hidden>
        <div class="sv-empty"><i class="fas fa-images"></i><p>No other works yet.</p></div>
      </div>

      <!-- Data State -->
      <div class="sv-state" data-state="data" hidden>
        <div class="fashion-gallery"></div>
      </div>
    </section>

  </main>

  <div id="toast-root"></div>
  <script type="module" src="./js/pages/piece.js"></script>
</body>
</html>
