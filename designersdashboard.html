<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONTROPP Designer Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <style>
    {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

.dashboard{
    display:flex;
    min-height:100vh;
}

/* Sidebar */

.sidebar{
    width:250px;
    background:white;
    border-right:1px solid #ddd;
    padding:30px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    margin-bottom:40px;
}

nav{
    display:flex;
    flex-direction:column;
    gap:18px;
}

nav a{
    text-decoration:none;
    color:#333;
}

/* Main */

main{
    flex:1;
    padding:40px;
}

/* Header */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

/* Stats */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.card{
    height:120px;
    background:white;
    border-radius:15px;
    border:1px solid #ddd;
    padding:20px;
}

/* Action */

.action-required{
    margin-bottom:30px;
}

.actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:15px;
}

.action-card{
    height:120px;
    background:white;
    border:1px solid #ddd;
    border-radius:15px;
}

/* Analytics */

.analytics{
    display:grid;
    grid-template-columns:3fr 1fr;
    gap:20px;
    margin-bottom:30px;
}

.chart{
    height:320px;
    background:white;
    border-radius:15px;
    border:1px solid #ddd;
}

.overview{
    height:320px;
    background:white;
    border-radius:15px;
    border:1px solid #ddd;
}

/* Bottom */

.bottom-grid{
    display:grid;
    grid-template-columns:2fr 1.5fr 1.5fr;
    gap:20px;
    margin-bottom:30px;
}

.orders,
.messages,
.top-designs{
    background:white;
    border-radius:15px;
    border:1px solid #ddd;
    min-height:320px;
    padding:20px;
}

/* Quick Buttons */

.quick-actions{
    display:flex;
    gap:20px;
}

.quick-actions button{
    padding:15px 30px;
}
</style>

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            ONTROPP
        </div>

        <nav>

            <a href="#">Dashboard</a>
            <a href="#">Products</a>
            <a href="#">Orders</a>
            <a href="#">Messages</a>
            <a href="#">Analytics</a>
            <a href="#">Customers</a>
            <a href="#">Reviews</a>
            <a href="#">Settings</a>

        </nav>

    </aside>



    <!-- Main Content -->

    <main>

        <!-- Header -->

        <header class="header">

            <div>

                <h1>Good Day, Frederick</h1>

                <p>Here's how your brand is performing today.</p>

            </div>

            <button>
                Quick Action
            </button>

        </header>



        <!-- Statistics -->

        <section class="stats">

            <div class="card"
        </section>



        <!-- Action Required -->

        <section class="action-required">

            <h2>Action Required</h2>

            <div class="actions">

                <div class="action-card"></div>

                <div class="action-card"></div>

                <div class="action-card"></div>

                <div class="action-card"></div>

            </div>

        </section>



        <!-- Analytics -->

        <section class="analytics">

            <div class="chart">

            </div>

            <aside class="overview">

            </aside>

        </section>



        <!-- Lower Grid -->

        <section class="bottom-grid">

            <div class="orders">

                <h3>Recent Orders</h3>

            </div>

            <div class="messages">

                <h3>Recent Messages</h3>

            </div>

            <div class="top-designs">

                <h3>Top Performing Designs</h3>

            </div>

        </section>



        <!-- Floating Quick Actions -->

        <section class="quick-actions">

            <button>Upload Design</button>

            <button>Add Product</button>

            <button>Create Collection</button>

            <button>Share Portfolio</button>

        </section>

    </main>

</div>

</body>
</html>
