<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ontropp — Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="/css/components/masonry.css">
<link rel="stylesheet" href="/css/components/cards.css">
<link rel="stylesheet" href="/css/components/toast.css">
<link rel="stylesheet" href="/css/pages/publicProfile.css">
</head>
<body>

<header class="topbar">
  <a href="#" class="logo">ONTROPP</a>
</header>

<main class="profile public-profile">
  <div class="cover">
    <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1600&q=85" alt="Fashion editorial cover">
  </div>

  <section class="profile-header">
    <div class="profile-top">
      <img class="avatar" src="https://i.pravatar.cc/150?img=47" alt="Designer avatar">

      <div class="profile-main">
        <div class="profile-name-row">
          <h1 class="profile-name">—</h1>
          <span class="verified">✓</span>
        </div>

        <div class="profile-meta">
          <span class="profile-studio">—</span>
          <span class="dot">•</span>
          <span class="profile-location">—</span>
        </div>

        <p class="bio">Contemporary womenswear designer creating timeless pieces with African roots. I blend tradition with modern silhouettes to tell stories through fabric, form and detail.</p>

        <div class="socials">
          <a href="#" aria-label="Instagram">Instagram</a>
          <a href="#" aria-label="TikTok">TikTok</a>
          <a href="#" aria-label="Website">🌐</a>
        </div>

        <div class="actions">
          <button class="btn btn-message">💬 Message</button>
          <button class="btn btn-follow" id="btn-follow">＋ Follow</button>
          <button class="btn btn-share" aria-label="Share profile">
            <i class="fas fa-share-alt"></i>
          </button>
        </div>
      </div>

      <div class="availability"><span class="availability-dot"></span>Available</div>
    </div>

    <div class="stats">
      <div class="stat"><strong id="stat-works">—</strong><span>Works</span></div>
      <div class="stat"><strong>—</strong><span>No reviews yet</span></div>
      <div class="stat"><strong>2</strong><span>Services</span></div>
      <div class="stat"><strong>&lt;24h</strong><span>Response time</span></div>
    </div>

    <nav class="tabs" id="profile-tab">
      <button class="tab active" data-tab="work">Work</button>
      <button class="tab" data-tab="services">Services</button>
      <button class="tab" data-tab="about">About</button>
      <button class="tab" data-tab="reviews">Reviews</button>
    </nav>

    <section class="portfolio-container">
      <div class="portfolio-section work" id="portfolio-work">
        <div class="section-heading"><h2>Work</h2></div>

        <!-- Mount node for masonry.js. The JS will add
             .masonry-columns and populate with .masonry-col. -->
        <div id="work-mount" aria-busy="true">
          <div class="work-loading">Loading work…</div>
        </div>
      </div>

      <div class="portfolio-section services" id="portfolio-services"></div>
      <div class="portfolio-section about" id="portfolio-about"></div>
      <div class="portfolio-section reviews" id="portfolio-reviews"></div>
    </section>
  </section>
</main>

<div id="toast-root"></div>
<script type="module" src="/js/pages/publicProfile.js"></script>
</body>
</html>
