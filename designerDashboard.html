<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designer Dashboard — ONTROPP</title>
  <link rel="stylesheet" href="./css/CORE.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pageLevel.css">
  <link rel="stylesheet" href="./css/stateManager.css">
  <link rel="stylesheet" href="./designers/css/designer-dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- TOP BAR -->
<header class="dashboard-header">
  <div class="header-container">
    <div class="logo">ONTROPP.</div>
    <div class="header-actions">
      <button class="icon-btn" id="messages-btn" aria-label="Messages">
        <i class="fas fa-comment"></i>
        <span class="badge" id="msg-badge">0</span>
      </button>
      <a href="designerDashboard.html" class="add-product-btn">
        <i class="fas fa-box"></i>
        <span>My Products</span>
      </a>
    </div>
  </div>
</header>

<!-- WELCOME -->
<div class="welcome-wrap animate-in">
  <div class="welcome" id="welcome-section">
    <div class="welcome-text" id="welcome-text">
      <div class="sk-welcome-title sk-shimmer"></div>
      <div class="sk-welcome-sub sk-shimmer"></div>
    </div>
    <div class="status-pill sk-status" id="store-status">
      <span class="status-dot sk-shimmer"></span>
      <span class="sk-status-text sk-shimmer"></span>
    </div>
  </div>
</div>

<!-- SECTION 1: BEST SELLER + STATS -->
<section class="section animate-in delay-1">
  <div class="hero-grid">
    
    <!-- Best Seller — shape-matched skeleton -->
    <div class="best-seller" id="best-seller-section">
      <div class="best-seller-header">
        <h2>Best Performing This Week</h2>
        <span class="trend-badge sk-shimmer" id="trend-badge" style="display:none;">
          <i class="fas fa-arrow-trend-up"></i> Trending
        </span>
      </div>
      <div class="best-seller-img">
        <div class="sk-bs-image sk-shimmer"></div>
      </div>
      <div class="best-seller-meta">
        <div class="sk-bs-title sk-shimmer"></div>
        <div class="sk-bs-rating sk-shimmer"></div>
      </div>
      <div class="best-seller-views">
        <div class="sk-bs-views sk-shimmer"></div>
      </div>
    </div>

    <!-- Status Cards — shape-matched skeletons -->
    <div class="status-cards" id="status-cards">
      <div class="status-card sk-card">
        <div class="sk-card-label sk-shimmer"></div>
        <div class="sk-card-value sk-shimmer"></div>
        <div class="sk-card-hint sk-shimmer"></div>
      </div>
      <div class="status-card sk-card">
        <div class="sk-card-label sk-shimmer"></div>
        <div class="sk-card-value sk-shimmer"></div>
        <div class="sk-card-hint sk-shimmer"></div>
      </div>
      <div class="status-card sk-card">
        <div class="sk-card-label sk-shimmer"></div>
        <div class="sk-card-value sk-shimmer"></div>
        <div class="sk-card-hint sk-shimmer"></div>
      </div>
      <div class="status-card sk-card">
        <div class="sk-card-label sk-shimmer"></div>
        <div class="sk-card-value sk-shimmer"></div>
        <div class="sk-card-hint sk-shimmer"></div>
      </div>
    </div>

  </div>
</section>

<!-- SECTION 2: ANALYTICS + INSIGHTS -->
<section class="section animate-in delay-2">
  <div class="analytics-grid">
    
    <!-- Weekly Chart -->
    <div class="panel" id="chart-panel">
      <div class="panel-header">
        <h2>This Week's Activity</h2>
        <span class="period">vs last week</span>
      </div>
      <div class="chart-area" id="chart-area">
        <div class="chart-bars" id="chart-bars">
          <div class="chart-bar sk-bar sk-shimmer"></div>
          <div class="chart-bar sk-bar sk-shimmer"></div>
          <div class="chart-bar sk-bar sk-shimmer"></div>
          <div class="chart-bar sk-bar sk-shimmer"></div>
          <div class="chart-bar sk-bar sk-shimmer"></div>
          <div class="chart-bar sk-bar sk-shimmer"></div>
          <div class="chart-bar sk-bar sk-shimmer"></div>
        </div>
        <div class="chart-legend">
          <div class="legend-item">
            <span class="legend-dot primary"></span>
            Total listing views
          </div>
          <div class="legend-item">
            <span class="legend-dot secondary"></span>
            Unique visitors
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Insights -->
    <div class="panel" id="insights-panel">
      <div class="panel-header">
        <h2>Quick Insights</h2>
      </div>
      <div class="insights-list" id="insights-list">
        <div class="insight-item sk-insight">
          <div class="insight-icon sk-insight-icon sk-shimmer"></div>
          <div class="insight-body">
            <div class="sk-insight-title sk-shimmer"></div>
            <div class="sk-insight-desc sk-shimmer"></div>
          </div>
        </div>
        <div class="insight-item sk-insight">
          <div class="insight-icon sk-insight-icon sk-shimmer"></div>
          <div class="insight-body">
            <div class="sk-insight-title sk-shimmer"></div>
            <div class="sk-insight-desc sk-shimmer"></div>
          </div>
        </div>
        <div class="insight-item sk-insight">
          <div class="insight-icon sk-insight-icon sk-shimmer"></div>
          <div class="insight-body">
            <div class="sk-insight-title sk-shimmer"></div>
            <div class="sk-insight-desc sk-shimmer"></div>
          </div>
        </div>
        <div class="insight-item sk-insight">
          <div class="insight-icon sk-insight-icon sk-shimmer"></div>
          <div class="insight-body">
            <div class="sk-insight-title sk-shimmer"></div>
            <div class="sk-insight-desc sk-shimmer"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- SECTION 3: DISCOVERY -->
<section class="section animate-in delay-3">
  <div class="discovery-grid">
    
    <!-- Top Designers -->
    <div class="discovery-panel" id="designers-panel">
      <div class="panel-header">
        <h2>Top Designers in <span id="category-name">...</span></h2>
        <span class="see-more">See more →</span>
      </div>
      <div class="designer-cards" id="designer-cards">
        <div class="designer-card sk-designer">
          <div class="sk-designer-avatar sk-shimmer"></div>
          <div class="designer-info sk-designer-info">
            <div class="sk-designer-handle sk-shimmer"></div>
            <div class="sk-designer-stats sk-shimmer"></div>
          </div>
          <div class="sk-designer-btn sk-shimmer"></div>
        </div>
        <div class="designer-card sk-designer">
          <div class="sk-designer-avatar sk-shimmer"></div>
          <div class="designer-info sk-designer-info">
            <div class="sk-designer-handle sk-shimmer"></div>
            <div class="sk-designer-stats sk-shimmer"></div>
          </div>
          <div class="sk-designer-btn sk-shimmer"></div>
        </div>
        <div class="designer-card sk-designer">
          <div class="sk-designer-avatar sk-shimmer"></div>
          <div class="designer-info sk-designer-info">
            <div class="sk-designer-handle sk-shimmer"></div>
            <div class="sk-designer-stats sk-shimmer"></div>
          </div>
          <div class="sk-designer-btn sk-shimmer"></div>
        </div>
        <div class="designer-card sk-designer">
          <div class="sk-designer-avatar sk-shimmer"></div>
          <div class="designer-info sk-designer-info">
            <div class="sk-designer-handle sk-shimmer"></div>
            <div class="sk-designer-stats sk-shimmer"></div>
          </div>
          <div class="sk-designer-btn sk-shimmer"></div>
        </div>
      </div>
    </div>

    <!-- Trending Products -->
    <div class="discovery-panel" id="trending-panel">
      <div class="panel-header">
        <h2>Trending in <span id="trending-category">...</span></h2>
        <span class="see-more">See more →</span>
      </div>
      <div class="product-thumbs" id="trending-products">
        <div class="product-thumb sk-product">
          <div class="product-thumb-img sk-product-img sk-shimmer"></div>
          <div class="product-thumb-info sk-product-info">
            <div class="sk-product-name sk-shimmer"></div>
            <div class="sk-product-views sk-shimmer"></div>
          </div>
        </div>
        <div class="product-thumb sk-product">
          <div class="product-thumb-img sk-product-img sk-shimmer"></div>
          <div class="product-thumb-info sk-product-info">
            <div class="sk-product-name sk-shimmer"></div>
            <div class="sk-product-views sk-shimmer"></div>
          </div>
        </div>
        <div class="product-thumb sk-product">
          <div class="product-thumb-img sk-product-img sk-shimmer"></div>
          <div class="product-thumb-info sk-product-info">
            <div class="sk-product-name sk-shimmer"></div>
            <div class="sk-product-views sk-shimmer"></div>
          </div>
        </div>
        <div class="product-thumb sk-product">
          <div class="product-thumb-img sk-product-img sk-shimmer"></div>
          <div class="product-thumb-info sk-product-info">
            <div class="sk-product-name sk-shimmer"></div>
            <div class="sk-product-views sk-shimmer"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

<div class="bottom-spacer"></div>

<!-- QUICK ACTIONS -->
<div class="quick-bar">
  <div class="quick-bar-inner">
    <button class="quick-btn" onclick="location.href='upload.html'">
      <i class="fas fa-plus"></i>
      <span class="qa-text">Add Product</span>
    </button>
    <button class="quick-btn highlight" onclick="location.href='designerDashboard.html'">
      <i class="fas fa-layer-group"></i>
      <span class="qa-text">My Products</span>
    </button>
  </div>
</div>

<script type="module" src="./designers/js/authCheck.js"></script>
<script type="module" src="./designers/js/designerDashboard.js"></script>
</body>
</html>
