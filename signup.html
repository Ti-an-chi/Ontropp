<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ONTROPP.</title>

  <!-- Shared design system -->
  <link rel="stylesheet" href="./css/CORE.css">

  <!-- Page-specific styles -->
  <style>
    /* ---------- Auth page layout ---------- */
    .auth-header {
      background-color: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .auth-header .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .auth-header .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .auth-main {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg) var(--space-md);
    }

    /* ---------- Card ---------- */
    .auth-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      padding: var(--space-xl) var(--space-lg);
      animation: fadeInUp 0.4s ease;
    }

    .form-title {
      text-align: center;
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--text);
      margin-bottom: var(--space-xs);
    }

    .form-subtitle {
      text-align: center;
      color: var(--hash);
      font-size: var(--text-sm);
      margin-bottom: var(--space-lg);
    }

    /* ---------- Form fields ---------- */
    .form-group {
      margin-bottom: var(--space-md);
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text);
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      font-family: inherit;
      color: var(--text);
      background-color: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(52, 131, 224, 0.15);
    }

    /* ---------- Submit button ---------- */
    .form-actions {
      margin-top: var(--space-lg);
    }

    .btn-submit {
      width: 100%;
      padding: 12px 20px;
      background-color: var(--secondary);
      color: var(--white);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--accent);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ---------- Toggle link ---------- */
    .form-link {
      text-align: center;
      margin-top: var(--space-lg);
      font-size: var(--text-sm);
      color: var(--hash);
    }

    .form-link a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .form-link a:hover {
      text-decoration: underline;
    }

    /* ---------- Messages ---------- */
    .message {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: var(--space-md);
      font-size: var(--text-sm);
      animation: fadeIn 0.2s ease;
    }

    .message.error {
      background-color: #fee2e2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .message.success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    /* ---------- OTP verification ---------- */
    .email-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-md);
      background-color: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin: var(--space-md) 0;
      gap: var(--space-md);
    }

    .email-box .small {
      font-size: var(--text-xs);
      color: var(--hash);
      margin-bottom: 2px;
    }

    .email-box .small-muted {
      font-size: var(--text-xs);
      color: var(--hash);
    }

    .otp {
      display: flex;
      justify-content: center;
      gap: var(--space-sm);
      margin: var(--space-md) 0;
    }

    .otp input {
      width: 44px;
      height: 52px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 600;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      background-color: var(--white);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .otp input:hover {
      border-color: var(--primary);
    }

    .otp input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(52, 131, 224, 0.15);
    }

    .verify-actions {
      display: flex;
      gap: var(--space-sm);
      margin-top: var(--space-md);
    }

    .btn-verify {
      flex: 1;
      padding: 12px 20px;
      background-color: var(--border);
      color: var(--white);
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      font-weight: 600;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-verify:not(:disabled) {
      background-color: var(--secondary);
      cursor: pointer;
    }

    .btn-verify:not(:disabled):hover {
      background-color: var(--accent);
    }

    .btn-verify:disabled {
      cursor: not-allowed;
    }

    .btn-resend {
      padding: 12px 16px;
      background-color: var(--white);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn-resend:hover:not(:disabled) {
      background-color: var(--background);
    }

    .btn-resend:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .muted-link {
      color: var(--hash);
      font-size: var(--text-sm);
      text-decoration: none;
      display: inline-block;
      margin-top: var(--space-md);
    }

    .muted-link:hover {
      color: var(--primary);
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 480px) {
      .auth-card {
        padding: var(--space-lg) var(--space-md);
        border-radius: var(--radius-lg);
      }

      .otp input {
        width: 38px;
        height: 46px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <header class="auth-header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">ONTROPP.</a>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="container">
      <section id="signupSection" class="auth-card">
        <h1 class="form-title">Log In</h1>
        <p class="form-subtitle">Welcome back — sign in to continue</p>

        <div id="message" class="message" style="display: none;"></div>

        <form id="signupForm">
          <div class="form-group" id="uname" style="display:none">
            <label for="username">Username</label>
            <input type="text" id="username" class="form-control" autocomplete="username">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div id="passwordMount"></div>
          </div>

          <div class="form-group" id="confPass" style="display:none">
            <label for="confirmPassword">Confirm Password</label>
            <div id="confirmPasswordMount"></div>
          </div>

          <div class="form-actions">
            <input type="submit" class="btn-submit" id="authBtn" value="Log In">
          </div>
        </form>

        <div class="form-link" id="toggleText"></div>
      </section>

      <section id="verifySection" class="auth-card" style="display:none">
        <h1 id="verifyTitle" class="form-title">Verify your email</h1>
        <p class="form-subtitle">We sent a 6-digit code to your email.</p>

        <div class="email-box" aria-live="polite">
          <div>
            <div class="small">Code sent to</div>
            <div id="emailText" style="font-weight:600; font-size: var(--text-sm);"></div>
          </div>
          <div id="emailMasked" class="small-muted"></div>
        </div>

        <div class="otp">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
        </div>

        <div class="verify-actions">
          <button id="verifyBtn" class="btn-verify" disabled>Verify</button>
          <button id="resendBtn" class="btn-resend">Resend Code</button>
        </div>

        <div id="verifyMsg" class="message" style="display:none"></div>

        <a href="#" class="muted-link" id="toLogin2">← Back to login</a>
      </section>
    </div>
  </main>

  <script type="module" src="api.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
