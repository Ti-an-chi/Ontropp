<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ontropp — Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="/css/CORE.css">
<link rel="stylesheet" href="/css/components/masonry.css">
<link rel="stylesheet" href="/css/components/cards.css">
<link rel="stylesheet" href="/css/components/toast.css">
<link rel="stylesheet" href="/css/tabs/dashboard.css">
<link rel="stylesheet" href="/css/pages/publicProfile.css">
</head>
<body>

<header class="topbar">
  <a href="#" class="logo">ONTROPP</a>
</header>

<main class="profile public-profile">

  <!-- COVER: painted by JS from designer id (no backend cover) -->
  <div class="cover" id="profile-cover"></div>

  <!-- =========================================================
       HEADER STATE VIEW — loading / data
       The [data-state="data"] sibling is empty in markup;
       renderHeader() fills it. CSS fades between states.
       ========================================================= -->
  <section class="profile-header" data-state-view="profile-header">

    <!-- ---------- LOADING ---------- -->
    <div data-state="loading" class="sv-state">
      <div class="profile-top">
        <div class="avatar shimmer" style="border:none;"></div>
        <div class="profile-main">
          <div class="skeleton-line h-20 w-40"></div>
          <div class="skeleton-line h-14 w-30 mt-2"></div>
          <div class="skeleton-line h-14 w-60 mt-2"></div>
          <div class="skeleton-line h-14 w-95 mt-2"></div>
          <div class="skeleton-line h-14 w-85 mt-2"></div>
          <div class="actions">
            <div class="skeleton-btn"></div>
            <div class="skeleton-btn"></div>
            <div class="skeleton-btn" style="width:46px;"></div>
          </div>
        </div>
        <div class="availability skeleton-btn" style="width:96px;"></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="skeleton-line h-16 w-20 mx-auto"></div><div class="skeleton-line h-12 w-40 mx-auto mt-2"></div></div>
        <div class="stat"><div class="skeleton-line h-16 w-20 mx-auto"></div><div class="skeleton-line h-12 w-40 mx-auto mt-2"></div></div>
        <div class="stat"><div class="skeleton-line h-16 w-20 mx-auto"></div><div class="skeleton-line h-12 w-40 mx-auto mt-2"></div></div>
        <div class="stat"><div class="skeleton-line h-16 w-20 mx-auto"></div><div class="skeleton-line h-12 w-40 mx-auto mt-2"></div></div>
      </div>
    </div>

    <!-- ---------- DATA ---------- -->
    <div data-state="data" hidden class="sv-state">
      <div class="profile-top">
        <img class="avatar" alt="">
        <div class="profile-main">
          <div class="profile-name-row">
            <h1 class="profile-name"></h1>
            <span class="verified">✓</span>
          </div>
          <div class="profile-meta">
            <span class="profile-studio"></span>
            <span class="dot">•</span>
            <span class="profile-location"></span>
          </div>
          <p class="bio"></p>
          <div class="socials"></div>
          <div class="actions">
            <button class="btn btn-message">💬 Message</button>
            <button class="btn btn-follow" id="btn-follow">＋ Follow</button>
            <button class="btn btn-share" aria-label="Share profile">
              <i class="fas fa-share-alt"></i>
            </button>
          </div>
        </div>
        <div class="availability"><span class="availability-dot"></span>Available</div>
      </div>
      <div class="stats">
        <div class="stat"><strong data-stat="works">—</strong><span>Works</span></div>
        <div class="stat"><strong data-stat="reviews">—</strong><span data-stat-label="reviews">Reviews</span></div>
        <div class="stat"><strong data-stat="services">—</strong><span>Services</span></div>
        <div class="stat"><strong data-stat="response">&lt;24h</strong><span>Response time</span></div>
      </div>
    </div>
  </section>

  <div class="profile-body">
    <nav class="tabs" id="profile-tab">
      <button class="tab active" data-tab="work">Work</button>
      <button class="tab" data-tab="services">Services</button>
      <button class="tab" data-tab="about">About</button>
      <button class="tab" data-tab="reviews">Reviews</button>
    </nav>
  
    <section class="portfolio-container">
      <div class="portfolio-section work" id="portfolio-work">
        <div class="section-heading"><h2>Work</h2></div>
  
        <!-- =====================================================
             WORK STATE VIEW — loading / empty / data
             ===================================================== -->
        <div id="work-mount" data-state-view="work">
          <div data-state="loading" class="sv-state">
            <div class="work-loading">Loading work…</div>
          </div>
          <div data-state="empty" hidden class="sv-state">
            <div class="work-empty">
              <i class="fas fa-scroll"></i>
              <p>No work published yet.</p>
            </div>
          </div>
          <div data-state="data" hidden class="sv-state"></div>
        </div>
      </div>
  
      <div class="portfolio-section services" id="portfolio-services"></div>
      <div class="portfolio-section about" id="portfolio-about"></div>
      <div class="portfolio-section reviews" id="portfolio-reviews"></div>
    </section>
  </div>
</main>

<div id="toast-root"></div>
<script type="module" src="/js/pages/publicProfile.js"></script>
</body>
</html>
